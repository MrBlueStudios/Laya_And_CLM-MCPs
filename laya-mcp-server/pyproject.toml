[project]
name = "laya-mcp-server"
version = "0.1.0"
description = "MCP server exposing the Laya calibrated decision model as the evaluate_laya_decision tool"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "laya[mcp]>=0.3.20,<0.4",
    "mcp>=2.2,<3",
]

[project.scripts]
# laya itself ships a `laya-mcp-server` script (its own generic tools), so this one is named apart.
laya-decision-mcp = "laya_mcp_server.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: loads a real Laya checkpoint (downloads ~0.8 GB on first run)",
]
