[project]
name = "clm-mcp-server"
version = "0.1.0"
description = "MCP server exposing CLM-8B (a running clm-serve) as evaluate_clm_decision and rank_clm_candidates"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# A thin client: the model runs in clm-serve (contrastive-lm, which needs vLLM or llama.cpp for its
# encoder). Keeping torch and vLLM out of this process keeps it fast to start and small to audit.
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27,<1",
]

[project.scripts]
clm-decision-mcp = "clm_mcp_server.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clm_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs a real clm-serve at CLM_TEST_URL (skipped otherwise)",
]
